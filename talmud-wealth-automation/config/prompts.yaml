brand:
  name: "タルムード資産論"
  tagline: "富は、思考の質から生まれる。"
  tone:
    - "知的"
    - "静か"
    - "落ち着いている"
    - "本質を突く"
    - "情報商材っぽくない"
    - "説教臭すぎない"
    - "安っぽく煽らない"
  forbidden:
    - "ユダヤ人全体の一般化"
    - "宗教や民族の神秘化"
    - "陰謀論的表現"
    - "出典不明の名言の断定利用"
    - "これで金持ち確定等の誇張"
    - "露骨な情報商材風コピー"
  forbidden_patterns:
    - "金持ち確定"
    - "絶対に儲か"
    - "陰謀"
    - "ユダヤの秘密"
    - "これだけで"
    - "必ず稼げ"

x_post:
  max_chars: 280
  purpose:
    - "興味を引く"
    - "答えたくさせる"
    - "無料noteへ誘導する"
  rules:
    - "クイズ形式"
    - "物語の導入だけを見せる"
    - "答えを言い切らない"
    - "最後にnote導線を入れる"
  required_cta: "物語と論点はnoteへ。"

free_note:
  min_length: 600
  purpose:
    - "物語を理解させる"
    - "争点を整理する"
    - "読者に考えさせる"
    - "有料noteへの橋をかける"
  structure:
    - "導入"
    - "物語全文"
    - "状況整理"
    - "争点整理"
    - "読者への問い"
    - "有料への導線"
  required_cta: "この話の解釈と、現代の仕事・商売・資産形成への応用は有料noteで深掘りします。"

paid_note:
  min_length: 1000
  purpose:
    - "解釈を与える"
    - "複数視点を整理する"
    - "現代の仕事・商売・資産形成へ翻訳する"
    - "実践に落とし込む"
  structure:
    - "導入"
    - "この話の本質"
    - "解釈"
    - "複数視点"
    - "現代応用"
    - "実践ポイント"
    - "まとめ"
  required_cta: "明日から使える形に変えることが、このブランドの目的です。"

review:
  criteria:
    - "知的さ"
    - "自然さ"
    - "安っぽさの少なさ"
    - "Xでのフック"
    - "無料noteの価値"
    - "有料noteの課金理由"
    - "現代応用の具体性"
    - "ブランド整合性"
    - "宗教・民族の扱いの丁寧さ"
  priorities:
    - "派手さより長く信頼されるか"
    - "強い言葉より知的で自然か"
    - "無料noteに価値があるか"
    - "有料noteが浅くないか"

formatter:
  priorities:
    - "読みやすさ"
    - "ブランドトーン維持"
    - "X文字数適合"
    - "無料noteの価値維持"
    - "有料noteの価値維持"

quality_check:
  - "安っぽくなっていないか"
  - "宗教や民族の扱いが雑でないか"
  - "Xで答えたくなるか"
  - "無料noteに価値があるか"
  - "有料noteに課金理由があるか"
  - "現代応用が浅すぎないか"
  - "ブランドの知的さを守れているか"
